name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Descarregar ffmpeg
        shell: pwsh
        run: |
          curl.exe -L --fail -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          tar -xf ffmpeg.zip
          Copy-Item ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe ffmpeg.exe

      - name: Gerar TwitchClipper.exe
        run: pyinstaller --noconfirm --onefile --windowed --name TwitchClipper --add-binary "ffmpeg.exe;." --collect-all streamlink app.py

      - uses: actions/upload-artifact@v4
        with:
          name: TwitchClipper
          path: dist/TwitchClipper.exe

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TwitchClipper.exe
